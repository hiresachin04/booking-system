# Application settings. No secrets in this file: passwords and API keys come from the environment or secrets/.

# Where bookings, seat state, discount usage and the notification outbox live.
#   in-memory : this JVM only; lost on restart; a single instance only.
#   postgres  : PostgreSQL (postgres.* below); survives restarts; safe with several instances.
storage=in-memory

postgres.url=jdbc:postgresql://localhost:5432/booking
postgres.user=booking

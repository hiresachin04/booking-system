# Application settings. No secrets in this file: passwords and API keys come from the environment or secrets/.

# Where bookings, seat state, discount usage and the notification outbox live.
#   in-memory : this JVM only; lost on restart; a single instance only.
#   postgres  : PostgreSQL (postgres.* below); survives restarts; safe with several instances.
storage=in-memory

# Used when storage=postgres. The schema in postgres.migrations is applied at startup.
postgres.url=jdbc:postgresql://localhost:5432/booking
postgres.user=booking
postgres.migrations=db/migrations
# Two pools, so booking locks can never starve the queries run while a lock is held (see PostgresDatabase).
#   pool.size     : connections for queries and transactions.
#   pool.lockSize : connections that hold a booking's advisory lock; at most this many bookings change at once.
postgres.pool.size=10
postgres.pool.lockSize=10
